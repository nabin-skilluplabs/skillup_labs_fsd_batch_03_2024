<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="./assets/22_gallery.css">
</head>
<body>

    <div class="outer-wrapper">
        <h2>Gallery</h2>
        <div class="inner-wrapper">
        </div>
    </div>
    <script>
        const galleryImages = [
            "https://plus.unsplash.com/premium_photo-1664304927996-d29de11f74db?q=80&w=1986&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1603627015794-a4a01d82b90d?q=80&w=1978&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1590364962261-20baeb6262a7?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            "https://plus.unsplash.com/premium_photo-1661514060856-e66a33f981ca?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1491911923017-19f90d8d7f83?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1561377916-e87f02d85b43?q=80&w=2040&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"


        ];
        function Image(url) {
            this.url = url;

        }
        function Gallery() {
            this.images = [];
            this.addImage = function(url) {
                const image = new Image(url);
                this.images.push(image);
                this.displayImages();

            }

            

            this.displayImages = function() {
                let imagesElements = '';
                for(let image of this.images) {
                    imagesElements += `<img src = "${image.url}" alt="" >`;
                }
                document.querySelector('.inner-wrapper').innerHTML = imagesElements;
            }

        }
        let gallery = new Gallery();
        for(let url of galleryImages) {
                gallery.addImage(url);

            }



    </script>
    
</body>
</html>
