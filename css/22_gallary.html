<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallary</title>
    <link rel="stylesheet" href="./assets/css/22_gallary.css">
</head>
<body>
    
    <div class="outer-wrapper">
        <h1>Gallary</h1>
        <div class="inner-wrapper">

        </div>

    </div>
    <script>
        const gallaryImages = [
            "1-pic.jpg",
            "2-pic.jpg",
            "3-pic.jpg",
            "4-pic.jpg",
            "5-pic.jpg",
            "6-pic.jpg"
        ]
        function Image(url) {
            this.url = url;
        } 
        function Gallary(){
            this.images = [];

            this.addImage = function(url){
                const image = new Image(url);
                this.images.push(image);
                this.displayImages();
            }

            this.displayImages = function(){
                let imagesElements = '';
                
                for(let image of this.images){
                    imagesElements += `<img src="./assets/images/${image.url}" alt="">`
                }
                document.querySelector('.inner-wrapper').innerHTML = imagesElements;
            }
        }
        let gallary = new Gallary();
        for(let image of gallaryImages){
            gallary.addImage(image);
        }

    </script>
</body>
</html>
