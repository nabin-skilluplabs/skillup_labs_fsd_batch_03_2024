<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Form</title>
    <link rel="stylesheet" href="./assets/index.css">
    <script defer src="./assets/index.js"></script>
</head>
<body>
    <section>
        <h2>Student Enrollment Form</h2>
        <form action="post">
            <h3>Personal Information</h3>
            <div class="form-row">
                <div class="form-item">
                    <label for="#">Full Name <span>*</span></label>
                    <input type="text" name="fullName" id="fullName">
                    <span id="fullName_error" class="error"></span>
                </div>
                <div class="form-item">
                    <label for="#">Email <span>*</span></label>
                    <input type="email" name="email" id="email">
                    <span id="email_error" class="error"></span>
                </div>
            </div>
            <div class="form-item">
                <label for="#">Mobile<span>*</span></label>
                <input type="tel" name="mobile" id="mobile">
                <span id="mobile_error" class="error"></span>
            </div>
            <div class="form-item">
                <label for="#">Residential Address</label>
                <input type="text"  name="address" id="address">
                
            </div>
            <h3>Academic Information</h3>
            <div class="form-row">
                <div class="form-item">
                    <label for="#">Education <span>*</span></label>
                    <select name="education" id="education">
                        <option value="">--select--</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                        <option value="Masters">Masters</option>
                        <option value="High School">High School</option> 
                    </select> 
                    <span id="education_error" class="error"></span>    
                </div>
                <div class="form-item">
                    <label for="#">College/University<span>*</span></label>
                    <input type="text" name="college" id="college">
                    <span id="college_error" class="error"></span>
                </div>
            </div>
            <h3>Course Information</h3>
            <div class="form-item">
                <label for="#">Courses<span>*</span></label>
                <select name="courses" id="courses">
                    <option value="Web Development">Web Development</option>
                    <option value="QA & Software Testing ">QA & Software Testing</option>
                    <option value="None">None</option>
                </select>
                <span id="courses_error" class="error"></span>
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label for="#">Enrollment Date<span>*</span></label>
                    <input type="date" name="date" id="date">
                    <span id="date_error" class="error"></span>
                </div>
                <div class="form-item">
                    <label for="#">Class Time Table<span>*</span></label>
                    <input type="text" name="timeTable" id="timeTable">
                    <span id="timeTable_error" class="error"></span>
                </div>
            </div>
            <div class="form-item">
                <label for="#">Course Fee</label>
                <input type="text" name="fee" id="fee">
            </div>
            <div>
               <input type="submit" value="Enroll Now">
               <input type="reset" value="Cancel">

            </div>


        </form>
    </section>
</body>
</html>
