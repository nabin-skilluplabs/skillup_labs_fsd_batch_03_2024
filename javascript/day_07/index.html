<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
</head>
<body>
    <section>
        <h1>Student Enrolment Form</h1>
        <form>
            <h3>Personal information</h3>
            <div class="form_row">
                <div class="form_item">
                    <label>Full Name <span>*</span></label>
                    <input type="text" name="fullName" id="fullName">
                    <span id="fullName_error" class="error"></span>
                </div>
                <div class="form_item">
                    <label>Email <span>*</span></label>
                    <input type="text" name="email" id="email">
                    <span id="email_error" class="error"></span>
                </div>
            </div>

            <div class="form_item">
                <label>Mobile Number<span>*</span></label>
                <input type="text" name="mobile" id="mobile">
                <span id="mobile_error" class="error"></span>
            </div>

            <div class="form_item">
                <label>Residential Address<span>*</span></label>
                <input type="text" name="address" id="address">
                <span id="address_error" class="error"></span>
            </div>

            <h3>Academic information</h3>
            <div class="form_row">
                <div class="form_item">
                   <label >Education<span>*</span></label>
                   <select id="education" name="education">
                    <option value="Masters">Masters</option>
                    <option value="Bachelors">Bachelors</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Certificate">Certificate</option>

                   </select>
                   <span id="education_error" class="error"></span>
            
                </div>
                <div class="form_item">
                    <label>College/University <span>*</span></label>
                    <input type="text" name="college" id="college">
                    <span id="college_error" class="error"></span>
                </div>
            </div>
            <h3>Course Information</h3>
            <div class="form_item">
                <label>Course<span>*</span></label>
                <select id="course" name="course">
                    <option value="">---Select Course--</option>
                    <option value="Full stack development">Full stack development</option>
                    <option value="QA and Software testing">QA and Software testing</option>
                </select>
                <span id="course_error" class="error"></span>
                
            </div>
            <div class="form_row">
                <div class="form_item">
                    <label>Enrolment date<span>*</span></label>
                    <input type="date" name="date" id="date">
                    <span id="date_error" class="error"></span>
                </div>
                <div class="form_item">
                    <label>Class Time Table <span>*</span></label>
                    <input type="text" name="timeTable" id="timeTable">
                    <span id="timeTable_error" class="error"></span>
                </div>
            </div>
            <div class="form_item">
                <label>Course Fee<span>*</span></label>
                <input type="text" name="courseFee" id="courseFee">
                <span id="courseFee_error" class="error"></span>
            </div>
            <div>
                <input type="submit" value="Enroll Now">
                <input type="reset" value="cancel">

            </div>
            
        </form>


    </section>
    
</body>
</html>
